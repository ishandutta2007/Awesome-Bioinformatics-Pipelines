<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#051923"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .pipeline-line {
        stroke-dasharray: 8 8;
        animation: dash 30s linear infinite;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .node-1 { animation-delay: 0s; }
      .node-2 { animation-delay: 0.8s; }
      .node-3 { animation-delay: 1.6s; }
      .node-4 { animation-delay: 2.4s; }

      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Background Animated Pipeline Graphic (Behind Foreground) -->
  <g opacity="0.45">
    <!-- Connecting Workflow Paths -->
    <path class="pipeline-line" d="M 50 80 Q 250 20 450 90 T 850 70 T 1150 110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <path class="pipeline-line" d="M 80 290 Q 380 340 680 270 T 1120 300" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
    <path class="pipeline-line" d="M 850 40 L 980 140 L 1120 220" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.4"/>

    <!-- Dynamic Flow Nodes -->
    <g transform="translate(1020, 70)">
      <circle cx="0" cy="0" r="28" fill="#0369a1" opacity="0.3" class="pulse-node node-1"/>
      <circle cx="0" cy="0" r="14" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#0f172a" font-weight="bold">QC</text>
    </g>

    <g transform="translate(1110, 150)">
      <circle cx="0" cy="0" r="32" fill="#4338ca" opacity="0.3" class="pulse-node node-2"/>
      <circle cx="0" cy="0" r="16" fill="#818cf8" filter="url(#softGlow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#0f172a" font-weight="bold">ALIGN</text>
    </g>

    <g transform="translate(1000, 240)">
      <circle cx="0" cy="0" r="30" fill="#6d28d9" opacity="0.3" class="pulse-node node-3"/>
      <circle cx="0" cy="0" r="15" fill="#c084fc" filter="url(#softGlow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#0f172a" font-weight="bold">CALL</text>
    </g>

    <g transform="translate(1110, 290)">
      <circle cx="0" cy="0" r="24" fill="#0e7490" opacity="0.3" class="pulse-node node-4"/>
      <circle cx="0" cy="0" r="12" fill="#22d3ee" filter="url(#softGlow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#0f172a" font-weight="bold">VCF</text>
    </g>

    <!-- DNA Helix Motif (Right Subtle Side) -->
    <g transform="translate(930, 20) scale(0.6)" opacity="0.25">
      <path d="M 0,0 C 50,75 50,125 0,200 C -50,275 -50,325 0,400" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <path d="M 0,0 C -50,75 -50,125 0,200 C 50,275 50,325 0,400" fill="none" stroke="#c084fc" stroke-width="4"/>
      <line x1="-35" y1="50" x2="35" y2="50" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-48" y1="100" x2="48" y2="100" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-35" y1="150" x2="35" y2="150" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-35" y1="250" x2="35" y2="250" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-48" y1="300" x2="48" y2="300" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-35" y1="350" x2="35" y2="350" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>

  <!-- Foreground Content: Header & Title & Tags (Guaranteed Crisp & High Contrast) -->
  <g transform="translate(70, 75)">
    <!-- Pill Badge -->
    <g>
      <rect width="250" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.4"/>
      <circle cx="16" cy="15" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="30" y="20" class="tag-text">REPRODUCIBLE GENOMICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Awesome <tspan fill="url(#accentGrad)">Bioinformatics</tspan> Pipelines
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle-text">
      Curated ecosystem of SaaS cloud platforms, open-source workflow engines,
    </text>
    <text x="0" y="152" class="subtitle-text">
      and production standards for reproducible multi-omics pipelines &amp; HPC scale.
    </text>

    <!-- Tech Badges / Pills in Foreground -->
    <g transform="translate(0, 185)">
      <!-- Nextflow -->
      <rect x="0" y="0" width="95" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
      <text x="47" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#86efac" font-weight="600">Nextflow</text>

      <!-- Snakemake -->
      <rect x="105" y="0" width="105" height="28" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="157" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#7dd3fc" font-weight="600">Snakemake</text>

      <!-- WDL / Cromwell -->
      <rect x="220" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="285" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#fde68a" font-weight="600">WDL / Cromwell</text>

      <!-- CWL -->
      <rect x="360" y="0" width="75" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
      <text x="397" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#fbcfe8" font-weight="600">CWL</text>

      <!-- nf-core -->
      <rect x="445" y="0" width="85" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="487" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#e9d5ff" font-weight="600">nf-core</text>

      <!-- GA4GH WES -->
      <rect x="540" y="0" width="115" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
      <text x="597" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#c7d2fe" font-weight="600">GA4GH WES</text>
    </g>
  </g>
</svg>
